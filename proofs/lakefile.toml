name = "decision_analysis_proofs"
defaultTargets = ["DecisionAnalysisProofs"]
# Share one dependency checkout (Mathlib ~7 GB) across the ecosystem's proofs/ projects. See ADR 0005.
packagesDir = "../../.lake-packages"

# mdgen turns the `/-! ... -/` module docs into Markdown (`make mdgen`; see README "Documents").
# Pinned to the tag matching the toolchain; `main` tracks the newest Lean release candidate.
# Listed before mathlib: Lake lets the *last* `require` win, so Mathlib's pins (e.g. of `Cli`,
# which mdgen also needs) take precedence and `lake exe cache get` computes the right hashes.
[[require]]
name = "mdgen"
git = "https://github.com/Seasawher/mdgen"
rev = "v4.30.0"

# Pin Mathlib to the same tag as the toolchain (Lean v4.30.0) so that
# `lake exe cache get` fetches prebuilt .oleans.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

# Finite kernels (`Kernel`, `comp`, `idK`, `ofFun`, `Stochastic`) live in the sibling package's
# proofs project.
[[require]]
name = "finite_kernels_proofs"
path = "../../FiniteKernels.jl/proofs"

[[lean_lib]]
name = "DecisionAnalysisProofs"

# `lake exe check_certificate FILE.json`: parse a certificate or witness document, dispatch on
# its `"schema"`, and decide it over ℚ with the proved checkers of `Certificate/`.
[[lean_exe]]
name = "check_certificate"
root = "CheckCertificate"
